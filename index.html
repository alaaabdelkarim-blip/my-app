<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Do Now</title><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --bg: #F1F3F7;
    --surface: #FFFFFF;
    --surface-2: #F7F8FB;
    --border: #DBDFE6;
    --text: #171A21;
    --text-muted: #5B6472;
    --accent: #33409B;
    --accent-contrast: #FFFFFF;
    --high: #D93A2B;
    --high-bg: #FCEAE8;
    --high-border: #F2BDB6;
    --medium: #B4700E;
    --medium-bg: #FBF0DA;
    --medium-border: #EFCE93;
    --low: #1E8F6F;
    --low-bg: #E3F4EE;
    --low-border: #A9DCC7;
    --shadow: 0 1px 2px rgba(23,26,33,0.06), 0 8px 24px -12px rgba(23,26,33,0.18);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161C;
      --surface: #1C1F27;
      --surface-2: #21242D;
      --border: #2E323D;
      --text: #ECEEF3;
      --text-muted: #9BA2B1;
      --accent: #8891FF;
      --accent-contrast: #12141B;
      --high: #FF6B5C;
      --high-bg: rgba(255,107,92,0.14);
      --high-border: rgba(255,107,92,0.4);
      --medium: #FFB13D;
      --medium-bg: rgba(255,177,61,0.14);
      --medium-border: rgba(255,177,61,0.4);
      --low: #3FCE9F;
      --low-bg: rgba(63,206,159,0.13);
      --low-border: rgba(63,206,159,0.4);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161C;
    --surface: #1C1F27;
    --surface-2: #21242D;
    --border: #2E323D;
    --text: #ECEEF3;
    --text-muted: #9BA2B1;
    --accent: #8891FF;
    --accent-contrast: #12141B;
    --high: #FF6B5C;
    --high-bg: rgba(255,107,92,0.14);
    --high-border: rgba(255,107,92,0.4);
    --medium: #FFB13D;
    --medium-bg: rgba(255,177,61,0.14);
    --medium-border: rgba(255,177,61,0.4);
    --low: #3FCE9F;
    --low-bg: rgba(63,206,159,0.13);
    --low-border: rgba(63,206,159,0.4);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Public Sans', system-ui, sans-serif;
    padding-inline: 20px;
    padding-block: 20px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  h1, h2, h3, .display { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  header .title-block h1 { font-size: 28px; margin: 0; }
  header .title-block p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  .view-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
  }
  .view-toggle button.active { background: var(--accent); color: var(--accent-contrast); }

  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    border-radius: 10px;
    padding: 9px 16px;
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: var(--high); border-color: var(--high-border); }
  .btn-danger.confirming { background: var(--high); color: #fff; border-color: var(--high); }
  .btn-icon { padding: 7px 9px; }

  .spotlight {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .spotlight.empty { color: var(--text-muted); font-weight: 600; }
  .spotlight-badge {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .spotlight-badge.high { background: var(--high-bg); border: 1px solid var(--high-border); }
  .spotlight-badge.medium { background: var(--medium-bg); border: 1px solid var(--medium-border); }
  .spotlight-badge.low { background: var(--low-bg); border: 1px solid var(--low-border); }
  .spotlight-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .spotlight-title { font-size: 18px; font-weight: 800; font-family: 'Archivo', sans-serif; margin: 2px 0 0; }
  .spotlight-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .spotlight-cta { margin-left: auto; flex: none; }

  @keyframes pulseAlert {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,58,43,0); }
    50% { box-shadow: 0 0 0 7px rgba(217,58,43,0.28); }
  }
  .flash { animation: pulseAlert 0.75s ease-in-out 3; }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

  .stats { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat-pill strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
  .column { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-height: 80px; }
  .column-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
  .column-head .dot { width: 9px; height: 9px; border-radius: 50%; }
  .column-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
  .column-head .count { margin-left: auto; font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .column-body { display: flex; flex-direction: column; gap: 8px; }
  .column-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 18px 6px; }

  /* Per-priority board column colors */
  .column.pri-high { background: #000000; }
  .column.pri-medium { background: #1D4ED8; }
  .column.pri-low { background: #FFFFFF; }
  .column.pri-low .column-head h2,
  .column.pri-low .column-head .count,
  .column.pri-low .column-empty { color: #4B5563; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 13px; box-shadow: var(--shadow);
  }
  .card.p-high { border-color: var(--high-border); }
  .card.p-high.undone { background: linear-gradient(0deg, var(--high-bg), var(--high-bg)), var(--surface); }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-check {
    flex: none; width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; color: var(--accent-contrast);
  }
  .card-check.checked { background: var(--accent); border-color: var(--accent); }
  .card-check svg { width: 12px; height: 12px; display: none; }
  .card-check.checked svg { display: block; }
  .card-title { font-weight: 700; font-size: 14.5px; line-height: 1.3; flex: 1; }
  .card-title.done { text-decoration: line-through; color: var(--text-muted); }
  .card-desc { font-size: 13px; color: var(--text-muted); margin: 6px 0 0; line-height: 1.4; }
  .card-desc.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .time-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
  }
  .card-foot .spacer { flex: 1; }
  .icon-btn {
    border: none; background: transparent; color: var(--text-muted); cursor: pointer;
    padding: 4px; border-radius: 6px; display: flex;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .list-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 13px; box-shadow: var(--shadow);
  }
  .list-row.p-high.undone { border-color: var(--high-border); background: linear-gradient(0deg, var(--high-bg), var(--high-bg)), var(--surface); }
  .list-row.p-medium.undone { border-color: var(--medium-border); background: linear-gradient(0deg, var(--medium-bg), var(--medium-bg)), var(--surface); }
  .list-row.p-low.undone { border-color: var(--low-border); background: linear-gradient(0deg, var(--low-bg), var(--low-bg)), var(--surface); }
  .priority-pill {
    flex: none; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 999px;
  }
  .priority-pill.high { background: var(--high-bg); color: var(--high); border: 1px solid var(--high-border); }
  .priority-pill.medium { background: var(--medium-bg); color: var(--medium); border: 1px solid var(--medium-border); }
  .priority-pill.low { background: var(--low-bg); color: var(--low); border: 1px solid var(--low-border); }
  .list-row .card-check { flex: none; }
  .list-main { flex: 1; min-width: 0; }
  .list-main .card-title { font-size: 14px; }
  .list-main .card-desc { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .card-foot { margin-top: 0; flex: none; }

  .completed-toggle {
    margin-top: 22px; background: none; border: none; color: var(--text-muted); font: inherit; font-weight: 600;
    font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .completed-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .completed-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text-muted);
  }
  .completed-row .card-title { font-size: 13px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty-state h3 { color: var(--text); margin: 10px 0 4px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,16,0.5); display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal {
    background: var(--surface); border-radius: 16px; padding: 22px; width: 100%; max-width: 440px;
    box-shadow: var(--shadow); border: 1px solid var(--border); max-height: calc(100% - 40px); overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input[type="text"], .field textarea, .field select, .field input[type="number"] {
    width: 100%; font: inherit; font-size: 14px; padding: 9px 11px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .priority-select { display: flex; gap: 6px; }
  .priority-select button {
    flex: 1; font: inherit; font-weight: 700; font-size: 12.5px; padding: 8px 6px; border-radius: 9px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer;
  }
  .priority-select button.sel-high.active { border-color: var(--high); color: var(--high); background: var(--high-bg); }
  .priority-select button.sel-medium.active { border-color: var(--medium); color: var(--medium); background: var(--medium-bg); }
  .priority-select button.sel-low.active { border-color: var(--low); color: var(--low); background: var(--low-bg); }
  .time-row { display: flex; gap: 8px; }
  .time-row input { flex: 2; }
  .time-row select { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .notice { font-size: 13px; color: var(--text-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
  [hidden] { display: none !important; }
</style>

<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Do Now</h1>
      <p>Your work, sorted by what actually needs you first.</p>
    </div>
    <div class="header-actions">
      <div class="view-toggle" role="tablist" aria-label="View">
        <button type="button" id="tab-board" class="active">Board</button>
        <button type="button" id="tab-list">List</button>
        <button type="button" id="tab-done">Done</button>
      </div>
      <button type="button" class="btn btn-primary" id="btn-add">+ Add task</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div id="spotlight" class="spotlight empty">Loading your board&hellip;</div>

  <div id="stats" class="stats" hidden></div>

  <div id="board-view" class="board"></div>
  <div id="list-view" class="list" hidden></div>
  <div id="done-view" class="list" hidden></div>

  <div id="empty-state" class="empty-state" hidden>
    <h3>Nothing on the board yet</h3>
    <p>Add what's on your plate and Do&nbsp;Now will tell you where to start.</p>
  </div>

  <button type="button" class="completed-toggle" id="completed-toggle" hidden>
    <span id="completed-caret">▸</span> <span id="completed-count">0 completed</span>
  </button>
  <div class="completed-list" id="completed-list" hidden></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Add task</h2>
    <form id="task-form">
      <div class="field">
        <label for="f-title">Task name</label>
        <input type="text" id="f-title" maxlength="120" required placeholder="e.g. Reply to the Milan salon escalation">
      </div>
      <div class="field">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" maxlength="600" placeholder="Any detail you'll want later"></textarea>
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="priority-select">
          <button type="button" class="sel-high" data-p="high">High</button>
          <button type="button" class="sel-medium" data-p="medium">Medium</button>
          <button type="button" class="sel-low" data-p="low">Low</button>
        </div>
      </div>
      <div class="field">
        <label for="f-time">Estimated time</label>
        <div class="time-row">
          <input type="number" id="f-time" min="1" max="999" value="30" required>
          <select id="f-unit">
            <option value="min">minutes</option>
            <option value="hr">hours</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Add task</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var RANK = { high: 0, medium: 1, low: 2 };
  var LABEL = { high: 'High priority', medium: 'Medium priority', low: 'Low priority' };
  var STORAGE_KEY = 'donow-tasks-v1';
  var state = { tasks: [], view: 'board', editingId: null, hasFlashed: false, storageOk: true };

  try { state.view = localStorage.getItem('donow-view') || 'board'; } catch (e) {}

  function formatEstimate(min) {
    if (min < 60) return min + 'm';
    var h = Math.floor(min / 60), m = min % 60;
    return m ? (h + 'h ' + m + 'm') : (h + 'h');
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function setView(v) {
    state.view = v;
    try { localStorage.setItem('donow-view', v); } catch (e) {}
    document.getElementById('tab-board').classList.toggle('active', v === 'board');
    document.getElementById('tab-list').classList.toggle('active', v === 'list');
    document.getElementById('tab-done').classList.toggle('active', v === 'done');
    document.getElementById('board-view').hidden = v !== 'board';
    document.getElementById('list-view').hidden = v !== 'list';
    document.getElementById('done-view').hidden = v !== 'done';
    render();
  }

  document.getElementById('tab-board').addEventListener('click', function () { setView('board'); });
  document.getElementById('tab-list').addEventListener('click', function () { setView('list'); });
  document.getElementById('tab-done').addEventListener('click', function () { setView('done'); });

  // ---- Modal ----
  var overlay = document.getElementById('overlay');
  var form = document.getElementById('task-form');
  var priorityButtons = Array.prototype.slice.call(document.querySelectorAll('.priority-select button'));
  var selectedPriority = 'medium';

  function setPriority(p) {
    selectedPriority = p;
    priorityButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.p === p); });
  }
  priorityButtons.forEach(function (b) { b.addEventListener('click', function () { setPriority(b.dataset.p); }); });

  function openModal(task) {
    state.editingId = task ? task.id : null;
    document.getElementById('modal-title').textContent = task ? 'Edit task' : 'Add task';
    document.getElementById('btn-save').textContent = task ? 'Save changes' : 'Add task';
    document.getElementById('f-title').value = task ? task.title : '';
    document.getElementById('f-desc').value = task ? (task.description || '') : '';
    setPriority(task ? task.priority : 'medium');
    var min = task ? task.estimateMinutes : 30;
    if (task && min >= 60 && min % 60 === 0) {
      document.getElementById('f-time').value = min / 60;
      document.getElementById('f-unit').value = 'hr';
    } else {
      document.getElementById('f-time').value = min;
      document.getElementById('f-unit').value = 'min';
    }
    overlay.hidden = false;
    setTimeout(function () { document.getElementById('f-title').focus(); }, 0);
  }
  function closeModal() { overlay.hidden = true; form.reset(); state.editingId = null; }

  document.getElementById('btn-add').addEventListener('click', function () { openModal(null); });
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = document.getElementById('f-title').value.trim();
    if (!title) return;
    var desc = document.getElementById('f-desc').value.trim();
    var raw = parseInt(document.getElementById('f-time').value, 10) || 1;
    var unit = document.getElementById('f-unit').value;
    var minutes = unit === 'hr' ? raw * 60 : raw;
    var payload = { title: title, description: desc, priority: selectedPriority, estimateMinutes: minutes };
    saveTask(state.editingId, payload);
    closeModal();
  });

  // ---- Persistence (local to this browser, via localStorage) ----
  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      state.storageOk = false;
      return [];
    }
  }

  function persistTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
    } catch (e) {
      state.storageOk = false;
      showNotice();
    }
  }

  function makeId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function saveTask(id, payload) {
    if (id) {
      var t = state.tasks.find(function (x) { return x.id === id; });
      if (t) {
        t.title = payload.title;
        t.description = payload.description;
        t.priority = payload.priority;
        t.estimateMinutes = payload.estimateMinutes;
      }
    } else {
      payload.id = makeId();
      payload.done = false;
      payload.createdAt = new Date().toISOString();
      payload.completedAt = null;
      state.tasks.push(payload);
    }
    persistTasks();
    render();
  }

  function toggleDone(task) {
    task.done = !task.done;
    task.completedAt = task.done ? new Date().toISOString() : null;
    persistTasks();
    render();
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    persistTasks();
    render();
  }

  // ---- Rendering ----
  function checkSvg() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function editSvg() {
    return '<svg viewBox="0 0 20 20" fill="none"><path d="M13.5 3.5l3 3L6.5 16.5H3.5v-3L13.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  }
  function trashSvg() {
    return '<svg viewBox="0 0 20 20" fill="none"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 019.5 3h1A1.5 1.5 0 0112 4.5V6M6 6l.7 9.5A1.5 1.5 0 008.2 17h3.6a1.5 1.5 0 001.5-1.5L14 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function cardActions(task) {
    return (
      '<button type="button" class="icon-btn" data-action="edit" data-id="' + task.id + '" aria-label="Edit">' + editSvg() + '</button>' +
      '<button type="button" class="btn-danger icon-btn" data-action="delete" data-id="' + task.id + '" aria-label="Delete">' + trashSvg() + '</button>'
    );
  }

  function renderCard(task, flash) {
    var undone = !task.done;
    var cls = 'card p-' + task.priority + (undone ? ' undone' : '') + (flash && undone && task.priority === 'high' ? ' flash' : '');
    var html = '<div class="' + cls + '" data-id="' + task.id + '">';
    html += '<div class="card-top">';
    html += '<button type="button" class="card-check' + (task.done ? ' checked' : '') + '" data-action="toggle" data-id="' + task.id + '" aria-label="Mark done">' + checkSvg() + '</button>';
    html += '<div class="card-title' + (task.done ? ' done' : '') + '">' + esc(task.title) + '</div>';
    html += '</div>';
    if (task.description) {
      html += '<div class="card-desc clamped">' + esc(task.description) + '</div>';
    }
    html += '<div class="card-foot"><span class="time-chip mono">' + formatEstimate(task.estimateMinutes) + '</span><span class="spacer"></span>' + cardActions(task) + '</div>';
    html += '</div>';
    return html;
  }

  function renderListRow(task, flash) {
    var undone = !task.done;
    var cls = 'list-row p-' + task.priority + (undone ? ' undone' : '') + (flash && undone && task.priority === 'high' ? ' flash' : '');
    var html = '<div class="' + cls + '" data-id="' + task.id + '">';
    html += '<button type="button" class="card-check' + (task.done ? ' checked' : '') + '" data-action="toggle" data-id="' + task.id + '" aria-label="Mark done">' + checkSvg() + '</button>';
    html += '<span class="priority-pill ' + task.priority + '">' + task.priority + '</span>';
    html += '<div class="list-main">';
    html += '<div class="card-title' + (task.done ? ' done' : '') + '">' + esc(task.title) + '</div>';
    if (task.description) html += '<div class="card-desc">' + esc(task.description) + '</div>';
    html += '</div>';
    html += '<div class="card-foot"><span class="time-chip mono">' + formatEstimate(task.estimateMinutes) + '</span>' + cardActions(task) + '</div>';
    html += '</div>';
    return html;
  }

  function bindRowEvents(root) {
    root.querySelectorAll('[data-action="toggle"]').forEach(function (el) {
      el.addEventListener('click', function () {
        var t = state.tasks.find(function (x) { return x.id === el.dataset.id; });
        if (t) toggleDone(t);
      });
    });
    root.querySelectorAll('[data-action="edit"]').forEach(function (el) {
      el.addEventListener('click', function () {
        var t = state.tasks.find(function (x) { return x.id === el.dataset.id; });
        if (t) openModal(t);
      });
    });
    root.querySelectorAll('[data-action="delete"]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (!el.classList.contains('confirming')) {
          el.classList.add('confirming');
          el.setAttribute('aria-label', 'Confirm delete');
          setTimeout(function () { el.classList.remove('confirming'); el.setAttribute('aria-label', 'Delete'); }, 2800);
        } else {
          deleteTask(el.dataset.id);
        }
      });
    });
    root.querySelectorAll('.card-desc.clamped').forEach(function (el) {
      el.addEventListener('click', function () { el.classList.toggle('clamped'); });
    });
  }

  function render() {
    var tasks = state.tasks;
    var open = tasks.filter(function (t) { return !t.done; });
    var done = tasks.filter(function (t) { return t.done; });

    document.getElementById('empty-state').hidden = tasks.length !== 0 || state.view === 'done';
    document.getElementById('board-view').hidden = state.view !== 'board' || tasks.length === 0;
    document.getElementById('list-view').hidden = state.view !== 'list' || tasks.length === 0;
    document.getElementById('done-view').hidden = state.view !== 'done';
    document.getElementById('stats').hidden = tasks.length === 0;

    renderSpotlight(open);
    renderStats(open);

    var flash = !state.hasFlashed;

    if (state.view === 'board') {
      var byP = { high: [], medium: [], low: [] };
      open.forEach(function (t) { byP[t.priority].push(t); });
      Object.keys(byP).forEach(function (p) {
        byP[p].sort(function (a, b) { return a.estimateMinutes - b.estimateMinutes; });
      });
      var boardEl = document.getElementById('board-view');
      boardEl.innerHTML = ['high', 'medium', 'low'].map(function (p) {
        var items = byP[p];
        var body = items.length
          ? items.map(function (t) { return renderCard(t, flash); }).join('')
          : '<div class="column-empty">Nothing here</div>';
        return (
          '<div class="column pri-' + p + '"><div class="column-head"><span class="dot" style="background:var(--' + p + ')"></span>' +
          '<h2>' + p + '</h2><span class="count">' + items.length + '</span></div>' +
          '<div class="column-body">' + body + '</div></div>'
        );
      }).join('');
      bindRowEvents(boardEl);
    } else if (state.view === 'list') {
      var sorted = open.slice().sort(function (a, b) {
        return RANK[a.priority] - RANK[b.priority] || a.estimateMinutes - b.estimateMinutes;
      });
      var listEl = document.getElementById('list-view');
      listEl.innerHTML = sorted.map(function (t) { return renderListRow(t, flash); }).join('');
      bindRowEvents(listEl);
    } else if (state.view === 'done') {
      var doneSorted = done.slice().sort(function (a, b) {
        return new Date(b.completedAt) - new Date(a.completedAt);
      });
      var doneEl = document.getElementById('done-view');
      doneEl.innerHTML = doneSorted.length
        ? doneSorted.map(function (t) { return renderListRow(t, false); }).join('')
        : '<div class="column-empty">No completed tasks yet</div>';
      bindRowEvents(doneEl);
    }

    state.hasFlashed = true;
  }

  function renderSpotlight(open) {
    var el = document.getElementById('spotlight');
    if (open.length === 0) {
      el.className = 'spotlight empty';
      el.innerHTML = state.tasks.length ? 'Everything on your board is done. Nice work.' : 'Add your first task and Do&nbsp;Now will tell you where to start.';
      return;
    }
    var pick = open.slice().sort(function (a, b) {
      return RANK[a.priority] - RANK[b.priority] || a.estimateMinutes - b.estimateMinutes;
    })[0];
    el.className = 'spotlight';
    el.innerHTML =
      '<div class="spotlight-badge ' + pick.priority + '">' + (pick.priority === 'high' ? '!' : pick.priority === 'medium' ? '●' : '✓') + '</div>' +
      '<div><div class="spotlight-eyebrow">Start here — ' + LABEL[pick.priority].toLowerCase() + '</div>' +
      '<div class="spotlight-title">' + esc(pick.title) + '</div>' +
      '<div class="spotlight-meta">About ' + formatEstimate(pick.estimateMinutes) + '</div></div>' +
      '<div class="spotlight-cta"><button type="button" class="btn btn-primary" data-action="toggle" data-id="' + pick.id + '">Mark done</button></div>';
    bindRowEvents(el);
  }

  function renderStats(open) {
    var counts = { high: 0, medium: 0, low: 0 };
    var totalMin = 0;
    open.forEach(function (t) { counts[t.priority]++; totalMin += t.estimateMinutes; });
    var el = document.getElementById('stats');
    el.innerHTML =
      ['high', 'medium', 'low'].map(function (p) {
        return '<span class="stat-pill"><span class="stat-dot" style="background:var(--' + p + ')"></span>' + p + ': <strong>' + counts[p] + '</strong></span>';
      }).join('') +
      '<span class="stat-pill">Total time left: <strong class="mono">' + formatEstimate(totalMin) + '</strong></span>';
  }

  function showNotice() {
    var n = document.getElementById('notice');
    n.hidden = false;
    n.textContent = 'Your browser is blocking local storage (private/incognito mode, or storage disabled), so tasks won’t be saved between visits. Try a normal browser window.';
  }

  // ---- Boot ----
  function boot() {
    state.tasks = loadTasks();
    setView(state.view);
    render();
  }

  boot();
})();
</script>

</body></html>
